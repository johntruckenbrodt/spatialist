name: conda build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            coveralls-flag: linux
          - name: Windows
            os: windows-latest
            coveralls-flag: windows

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v6

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: latest
          python-version: "3.11"
          environment-file: environment.yml

      # Linting once is sufficient; both jobs run the full test suite below.
      - name: Lint with flake8
        if: runner.os == 'Linux'
        run: |
          conda install -y flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all other errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Install package
        run: pip install .

      - name: Test with pytest and coverage
        run: |
          conda install -y pytest coverage
          coverage run -m pytest
          coverage xml -o coverage.xml

      # Each OS submits one part of the same parallel Coveralls build.
      # Do not publish coverage from forked pull requests.
      - name: Publish coverage to Coveralls
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: coverallsapp/github-action@v2.3.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura
          flag-name: ${{ matrix.coveralls-flag }}
          parallel: true

  coveralls-finish:
    name: Finalize Coveralls
    needs: test
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Finalize parallel Coveralls build
        uses: coverallsapp/github-action@v2.3.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
